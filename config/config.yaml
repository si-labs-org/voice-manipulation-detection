
project:
  name: "voice-manipulation-detection"
  version: "0.1.0"
  description: "Detection de manipulation de voix via RNN et Transformers"
  seed: 42
  device: "cuda"
  num_workers: 4

paths:
  drive_root: "/content/drive/MyDrive/voice-manipulation-detection"
  data_root: "/content/drive/MyDrive/voice-manipulation-detection/data"
  models_root: "/content/drive/MyDrive/voice-manipulation-detection/models"
  experiments_root: "/content/drive/MyDrive/voice-manipulation-detection/experiments"
  
  # Sous-dossiers
  raw_data: "/content/drive/MyDrive/voice-manipulation-detection/data/raw/ASVspoof2019/LA/LA"
  processed_data: "/content/drive/MyDrive/voice-manipulation-detection/data/processed"
  metadata: "/content/drive/MyDrive/voice-manipulation-detection/data/metadata"
  checkpoints: "/content/drive/MyDrive/voice-manipulation-detection/models/checkpoints"
  final_models: "/content/drive/MyDrive/voice-manipulation-detection/models/final"
  logs: "/content/drive/MyDrive/voice-manipulation-detection/experiments/logs"
  figures: "/content/drive/MyDrive/voice-manipulation-detection/experiments/figures"

data:
  dataset_name: "ASVspoof2019"
  subset_fraction: 0.1    # MODE TURBO (10%)
  debug_mode: true        # Activé
  task: "LA"
  sample_rate: 16000
  audio_duration: 4.0
  max_length: 64000
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  balance_classes: true
  augmentation:
    enabled: true
    techniques:
      - time_stretch: {rate: [0.9, 1.1]}
      - pitch_shift: {n_steps: [-2, 2]}
      - add_gaussian_noise: {amplitude: 0.005}
      - time_mask: {max_mask_size: 0.1}

preprocessing:
  feature_type: "mfcc"
  n_mfcc: 40
  n_fft: 512
  hop_length: 160
  win_length: 400
  n_mels: 80
  fmin: 0
  fmax: 8000
  normalize: true
  normalization_type: "instance"
  delta: true
  delta_delta: true

model:
  architecture: "transformer"
  input_dim: 40
  seq_length: 400
  hidden_dim: 256
  num_layers: 6
  dropout: 0.3
  activation: "relu"
  rnn:
    bidirectional: true
    rnn_type: "lstm"
  transformer:
    num_heads: 8
    dim_feedforward: 1024
    attention_dropout: 0.1
    use_positional_encoding: true
  num_classes: 2
  output_activation: null

training:
  batch_size: 64
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  optimizer:
    type: "adamw"
    betas: [0.9, 0.999]
    eps: 1e-08
  scheduler:
    type: "cosine"
    warmup_epochs: 5
    min_lr: 1e-07
    step_size: 30
    gamma: 0.1
    patience: 10
    factor: 0.5
  loss:
    type: "cross_entropy"
    label_smoothing: 0.1
    gamma: 2.0
    alpha: 0.25
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.0001
    monitor: "val_loss"
  checkpoint:
    save_best: true
    save_frequency: 5
    monitor: "val_eer"
    mode: "min"
  use_amp: true

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - eer
    - auc_roc
  eer:
    n_thresholds: 1000
  save_predictions: true
  save_attention_weights: true

logging:
  console_level: "INFO"
  log_to_file: true
  log_file: "${paths.logs}/training.log"
  tensorboard:
    enabled: true
    log_dir: "${paths.logs}/tensorboard"
  wandb:
    enabled: false
    project: "voice-manipulation-detection"
    entity: null
    tags: ["asvspoof2019", "transformer"]
  log_interval: 10
  val_interval: 1

reproducibility:
  deterministic: true
  benchmark: false

inference:
  batch_size: 128
  tta:
    enabled: false
    n_augmentations: 5
  save_probabilities: true
  threshold: 0.5
